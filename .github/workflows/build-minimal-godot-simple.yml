name: Build Minimal Godot (Simple)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-linux-minimal:
    runs-on: ubuntu-latest
    name: Build Linux Minimal Export Templates
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential scons pkg-config libx11-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev libudev-dev libxi-dev libxrandr-dev python3 python3-pip

      - name: Build minimal export templates
        run: |
          python3 build_minimal_godot.py
          ls -la bin/
          file bin/godot.linuxbsd.template_release.x86_64

      - name: Upload Linux minimal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-minimal-linux
          path: bin/godot.linuxbsd.template_release.x86_64
          retention-days: 30

  build-linux-ultra-minimal:
    runs-on: ubuntu-latest
    name: Build Linux Ultra-Minimal Export Templates
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential scons pkg-config libx11-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev libudev-dev libxi-dev libxrandr-dev python3 python3-pip

      - name: Build ultra-minimal export templates
        run: |
          python3 build_ultra_minimal.py
          ls -la bin/
          file bin/godot.linuxbsd.template_release.x86_64

      - name: Upload Linux ultra-minimal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-ultra-minimal-linux
          path: bin/godot.linuxbsd.template_release.x86_64
          retention-days: 30

  create-simple-release:
    needs: [build-linux-minimal, build-linux-ultra-minimal]
    runs-on: ubuntu-latest
    name: Create Simple Release
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release package
        run: |
          mkdir -p release
          cp artifacts/godot-minimal-linux/godot.linuxbsd.template_release.x86_64 release/godot.minimal.linuxbsd.template_release.x86_64
          cp artifacts/godot-ultra-minimal-linux/godot.linuxbsd.template_release.x86_64 release/godot.ultra-minimal.linuxbsd.template_release.x86_64
          
          # Get file sizes
          echo "File sizes:" > release/INFO.txt
          ls -lh release/ >> release/INFO.txt
          
          # Create README
          cat > release/README.md << 'EOF'
          # Minimal Godot 4.4 Linux Builds
          
          This release contains minimal Godot 4.4 builds for Linux with reduced RAM usage.
          
          ## Files Included
          
          - `godot.minimal.linuxbsd.template_release.x86_64` - Balanced minimal export template
          - `godot.ultra-minimal.linuxbsd.template_release.x86_64` - Ultra-minimal export template
          
          ## Usage
          
          1. Download the appropriate file
          2. In Godot editor, go to Project Settings → Export
          3. Set "Custom Template" to the downloaded export template
          4. Export your project
          
          ## Features
          
          ### Balanced Minimal Build
          - 2D rendering and physics
          - Basic audio and networking
          - Essential modules only
          - ~40-60% size reduction
          
          ### Ultra-Minimal Build
          - Headless only
          - GDScript only
          - ~70-80% size reduction
          
          ## Build Info
          Built on: $(date)
          Commit: ${{ github.sha }}
          EOF
          
          # Create zip file
          zip -r minimal-godot-linux-builds.zip release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: minimal-godot-linux-builds.zip
          tag_name: minimal-linux-${{ github.sha }}
          name: "Minimal Godot 4.4 Linux Builds"
          body: |
            ## Minimal Godot 4.4 Linux Builds
            
            This release contains minimal Godot 4.4 builds for Linux with significantly reduced RAM usage.
            
            ### What's Included
            - **Balanced Minimal Export Template** - 2D support, audio, networking
            - **Ultra-Minimal Export Template** - Headless only, GDScript only
            
            ### Key Optimizations
            - Disabled 3D rendering and physics
            - Disabled XR/VR support
            - Disabled heavy third-party libraries
            - Enabled size optimization and LTO
            - Kept only essential modules
            
            ### Expected Results
            - **Balanced Minimal**: 40-60% smaller, 30-50% less RAM usage
            - **Ultra-Minimal**: 70-80% smaller, 60-80% less RAM usage
            
            ### Usage
            1. Download the appropriate file
            2. In Godot editor, go to Project Settings → Export
            3. Set "Custom Template" to the downloaded export template
            4. Export your project
            
            Built from commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}